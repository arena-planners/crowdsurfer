action_type: differential_drive
sensor_needs: [laserscan]
obs_policy: latest_only

depends:
  global_plan: false

observations:
  aliases:
    robot_pose: robot_pose_from_tf

  datasources:
    robot_pose_from_tf:
      type: RobotPoseTFGenerator
      params: {}

    laser_scan:
      type: sensor_msgs/LaserScan
      params:
        topic: scan

    robot_state:
      type: nav_msgs/Odometry
      params:
        topic: odom

    pedestrians:
      type: arena_people_msgs/Pedestrians
      params:
        topic: arena_peds

    goal_pose:
      type: geometry_msgs/PoseStamped
      params:
        topic: goal_pose
